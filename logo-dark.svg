<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none" role="img" aria-label="Brickwise Advisors">
  <!-- THE STACK MARK: ascending brick layers -->
  <!-- Row 1 (base): 4 bricks -->
  <rect x="0"  y="38" width="10" height="8" rx="1.5" fill="#F24B3A"/>
  <rect x="12" y="38" width="10" height="8" rx="1.5" fill="#F24B3A"/>
  <rect x="24" y="38" width="10" height="8" rx="1.5" fill="#F24B3A"/>
  <rect x="36" y="38" width="10" height="8" rx="1.5" fill="#F24B3A"/>

  <!-- Row 2: 3 bricks, staggered -->
  <rect x="6"  y="27" width="10" height="8" rx="1.5" fill="#FF7A6E"/>
  <rect x="18" y="27" width="10" height="8" rx="1.5" fill="#FF7A6E"/>
  <rect x="30" y="27" width="10" height="8" rx="1.5" fill="#FF7A6E"/>

  <!-- Row 3: 2 bricks -->
  <rect x="12" y="16" width="10" height="8" rx="1.5" fill="rgba(255,173,158,0.75)"/>
  <rect x="24" y="16" width="10" height="8" rx="1.5" fill="rgba(255,173,158,0.75)"/>

  <!-- Row 4 (apex): 1 brick -->
  <rect x="18" y="5" width="10" height="8" rx="1.5" fill="rgba(255,255,255,0.5)"/>

  <!-- WORDMARK — white on dark -->
  <text x="56" y="22"
    font-family="'DM Sans', sans-serif"
    font-size="17"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#FFFFFF">Brickwise</text>
  <text x="56" y="40"
    font-family="'Inter', sans-serif"
    font-size="9.5"
    font-weight="500"
    letter-spacing="2"
    fill="rgba(223,204,232,0.75)">ADVISORS</text>
</svg>
